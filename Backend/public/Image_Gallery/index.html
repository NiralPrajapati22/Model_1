<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Gallery</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
    }

    .gallery img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 10px;
        transition: transform 0.3s ease;
        cursor: pointer;
    }

    .gallery img:hover {
        transform: scale(1.05);
    }
</style>
</head>

<body>

<h1>Image Gallery</h1>

<div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Nature">
    <img src="https://picsum.photos/id/1016/600/400" alt="Mountain">
    <img src="https://picsum.photos/id/1018/600/400" alt="River">
    <img src="https://picsum.photos/id/1020/600/400" alt="Forest">
    <img src="https://picsum.photos/id/1024/600/400" alt="Dog">
    <img src="https://picsum.photos/id/1035/600/400" alt="Beach">
</div>

</body>
</html>
